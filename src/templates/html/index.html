<!DOCTYPE html>
<html id="html">
  <head>
    <title>{{advert_name}}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="advert_id" content="{{advert_id}}">
    <meta name="advert_mc" content="{{advert_mc}}">
    <meta name="advert_variant" content="{{advert_variant}}">
    <meta name="advert_name" content="{{advert_name}}" />
    <meta name="click_url" content="{{click_url}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="[[css]]" />
    <style>
      /* Preloader styles */
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgb(var(--blue));
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.4s ease-out;
      }
      #preloader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #preloader svg {
        width: 40px;
        height: auto;
      }
      #preloader .s-outline {
        fill: none;
        stroke: #fff;
        stroke-width: 2;
      }
      #preloader .s-fill {
        fill: #fff;
        clip-path: inset(100% 0 0 0);
        transition: clip-path 0.3s ease-out;
      }
    </style>
  </head>
  <body>
    <!-- Preloader with S and dot -->
    <div id="preloader">
      <svg viewBox="397 0 116 151" xmlns="http://www.w3.org/2000/svg">
        <!-- Outline S and dot -->
        <path class="s-outline" d="M397.08 123.39h88.43v-11.87h-88.26c-.07-1.37-.03-28.14-.21-40.51-.15-10.55 7.05-20.82 20.66-20.59 24.8.41 49.63.41 74.43-.02 10.69-.19 20.42 7.66 20.41 20.43 0 1.78-.01 3.96-.01 6.27h-88.51v11.59l88.51-.02c0 1.59.03 28.4 0 40.87-.04 12.55-8.08 20.44-20.78 20.45h-73.8c-12.8 0-20.81-7.98-20.86-20.77v-5.83"/>
        <path class="s-outline" d="M454.91 38.03c-10.46 0-18.92-8.62-18.86-19.2C436.1 8.43 444.6-.02 454.98 0c10.37.02 18.85 8.51 18.87 18.9.02 10.56-8.47 19.14-18.94 19.13"/>
        <!-- Fill S and dot (animated) -->
        <path class="s-fill" id="sFill" d="M397.08 123.39h88.43v-11.87h-88.26c-.07-1.37-.03-28.14-.21-40.51-.15-10.55 7.05-20.82 20.66-20.59 24.8.41 49.63.41 74.43-.02 10.69-.19 20.42 7.66 20.41 20.43 0 1.78-.01 3.96-.01 6.27h-88.51v11.59l88.51-.02c0 1.59.03 28.4 0 40.87-.04 12.55-8.08 20.44-20.78 20.45h-73.8c-12.8 0-20.81-7.98-20.86-20.77v-5.83"/>
        <path class="s-fill" id="dotFill" d="M454.91 38.03c-10.46 0-18.92-8.62-18.86-19.2C436.1 8.43 444.6-.02 454.98 0c10.37.02 18.85 8.51 18.87 18.9.02 10.56-8.47 19.14-18.94 19.13"/>
      </svg>
      <!--<div id="preloaderStatus" style="position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: #fff; font-size: 10px; font-family: monospace; opacity: 0.7;"></div>-->
    </div>

    <div class="click-url" id="clickLayer">
        <div id="adContainer" class="template_variant_class {{template_variant_class}}">
          <div id="backgroundContainer">
            <div id="imageWrapper">
              <div style="background-image:url('{{background_image_1}}')" class="background_image_1"></div>
            </div>
            <div id="videoWrapper">
              <video autoplay muted playsinline loop crossorigin="anonymous">
                <source src="{{background_video_1}}" type="video/mp4" class="background_video_1"></video>
            </div>
          </div>
          <main>
            <div id="objectWrapper">
              <div style="background-image:url('{{background_image_2}}')" class="background_image_2"></div>
            </div>
            <div id="textContainer">
              <div id="stickerContainer">
                <div class="stickerTextWrapper">
                  <p class="sticker_text_1 sticker_style_1" style="{{sticker_style_1}}" data="{{sticker_text_1}}">{{sticker_text_1}}</p>
              <!-- if p and p.data is "empty" or " " -> nothing displays
              if p is "image" -> text wrapper does not display but the image wrapper -->
                </div>
                <div class="stickerImageWrapper">
                  <div style="background-image:url('{{sticker_image_1}}')" class="sticker_image_1"></div>
                </div>
              </div>
              <div id="cardContainer">
                <div class="cardImageWrapper">
                  <div style="background-image:url('{{background_image_3}}')" class="background_image_3">
                  {{background_image_3}}
                  <!-- if div is empty it is not displayed so background_image_3 path must be placed into the div as well, 
                  not just into style -->
                  </div>
                </div>
              </div>
              <!-- if any text layer p is empty 0 height block is displayed -->
              <div id="headlineWrapper">
                <h2 class="headline_text_1 headline_style_1" style="{{headline_style_1}}">{{headline_text_1}}</h2>
              </div>
              <div id="copyWrapper1">
                <p class="copy_text_1 copy_style_1" style="{{copy_style_1}}">{{copy_text_1}}</p>
              </div>
              <div id="copyWrapper2">
                <!-- copy_text_2 -->
                <p class="thm copy_text_2 copy_style_2" style="{{copy_style_2}}">{{copy_text_2}}</b></p>
              </div>
              <div id="buttonWrapper">
                <span class="cta_text_1 cta_style_1" style="{{cta_style_1}}" data="{{cta_text_1}}">{{cta_text_1}}</span>
                <!-- if buttonContainer > span is empty no button block is displayed -->
              </div>
              <div id="disclaimerWrapper1">
                <p class="disclaimer_text_1 disclaimer_style_1" style="{{disclaimer_style_1}}" data="{{disclaimer_text_1}}">{{disclaimer_text_1}}</p>
              </div>
            </div>
          </main>
          <div id="frameContainer"></div>
          <div id="logoContainer">
            <div id="logoWrapper">
              <img src="{{brand_image_1}}" class="logo logo_image_1 brand_image_1"/>
            </div>
          </div>
        </div>
    </div>
    <!-- extra css to finetune -->
    <style type="text/css">{{css_styles}}</style>
    <script>
        var ad = document.querySelector('#adContainer');
        document.body.classList.add("size-" + ad.offsetWidth + "x" + ad.offsetHeight);

        // Preloader logic - track loading of images and videos
        (function() {
          var preloader = document.getElementById('preloader');
          var sFill = document.getElementById('sFill');
          var dotFill = document.getElementById('dotFill');
          var adContainer = document.getElementById('adContainer');
          var statusEl = document.getElementById('preloaderStatus');
          var startTime = Date.now();

          function setStatus(text) {
            var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            var msg = '[' + elapsed + 's] ' + text;
            console.log('Preloader:', msg);
            if (statusEl) {
              statusEl.textContent = msg;
            }
          }

          setStatus('Init...');

          // Save template variant classes and remove them until preload complete
          var savedClasses = [];
          if (adContainer) {
            var classList = Array.prototype.slice.call(adContainer.classList);
            classList.forEach(function(cls) {
              if (cls !== 'template_variant_class') {
                savedClasses.push(cls);
              }
            });
            // Remove all classes except template_variant_class placeholder
            adContainer.className = 'template_variant_class';
            setStatus('Classes saved: ' + savedClasses.join(', '));
          }

          // Function to trigger animations after preload
          function triggerAnimations() {
            if (adContainer && savedClasses.length > 0) {
              adContainer.className = savedClasses.join(' ');
            }
          }

          // Get all images to track (skip videos - they load async in srcDoc iframes)
          var images = Array.prototype.slice.call(document.querySelectorAll('img'));
          var bgElements = Array.prototype.slice.call(document.querySelectorAll('[style*="background-image"]'));

          setStatus('Found: ' + images.length + ' img, ' + bgElements.length + ' bg');

          // Extract background image URLs
          var bgUrls = bgElements
            .map(function(el) {
              var style = el.getAttribute('style') || '';
              var match = style.match(/url\(['"]?([^'")\s]+)['"]?\)/);
              return match ? match[1] : null;
            })
            .filter(function(url) {
              return url && url.indexOf('{{') === -1;
            });

          setStatus('BG URLs to load: ' + bgUrls.length);

          // Create image objects for background images
          var bgImages = bgUrls.map(function(url) {
            var img = new Image();
            img.src = url;
            return img;
          });

          var allImages = images.concat(bgImages);
          var totalItems = allImages.length;
          var loadedItems = 0;

          setStatus('Total items to track: ' + totalItems + ' images');

          function updateProgress(source) {
            loadedItems++;
            var progress = totalItems > 0 ? (loadedItems / totalItems) : 1;
            var fillPercent = 100 - (progress * 100);

            setStatus('Loaded ' + loadedItems + '/' + totalItems + ' (' + source + ')');

            // Animate fill from bottom to top
            var clipPath = 'inset(' + fillPercent + '% 0 0 0)';
            if (sFill) sFill.style.clipPath = clipPath;
            if (dotFill) dotFill.style.clipPath = clipPath;

            // Hide preloader when all loaded
            if (loadedItems >= totalItems) {
              setStatus('All loaded! Hiding...');
              setTimeout(function() {
                if (preloader) preloader.classList.add('hidden');
                triggerAnimations();
                setTimeout(function() {
                  if (preloader) preloader.remove();
                }, 400);
              }, 200);
            }
          }

          // Track image loading
          allImages.forEach(function(img, i) {
            var src = img.src ? img.src.split('/').pop() : 'img' + i;
            if (img.complete) {
              updateProgress('img done: ' + src);
            } else {
              img.addEventListener('load', function() {
                updateProgress('img load: ' + src);
              });
              img.addEventListener('error', function() {
                console.error('Image load failed:', img.src);
                updateProgress('img err: ' + src);
              });
            }
          });

          // Fallback: hide preloader after max 5 seconds
          setTimeout(function() {
            if (preloader && !preloader.classList.contains('hidden')) {
              setStatus('TIMEOUT! Only ' + loadedItems + '/' + totalItems + ' loaded');
              if (sFill) sFill.style.clipPath = 'inset(0 0 0 0)';
              if (dotFill) dotFill.style.clipPath = 'inset(0 0 0 0)';
              setTimeout(function() {
                preloader.classList.add('hidden');
                triggerAnimations();
                setTimeout(function() {
                  preloader.remove();
                }, 400);
              }, 200);
            }
          }, 5000);

          // If no items to load, hide immediately
          if (totalItems === 0) {
            setStatus('No items to load');
            if (sFill) sFill.style.clipPath = 'inset(0 0 0 0)';
            if (dotFill) dotFill.style.clipPath = 'inset(0 0 0 0)';
            setTimeout(function() {
              if (preloader) preloader.classList.add('hidden');
              triggerAnimations();
              setTimeout(function() {
                preloader.remove();
              }, 400);
            }, 300);
          }
        })();
    </script>
  </body>
</html>
