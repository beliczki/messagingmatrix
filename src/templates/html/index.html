  <!-- 
  TEMPLATE VARIANT CLASSES:
  behaviour: 
        -> '' - no animation is applied
        -> 'animated' - animation is applied
  layout:
        -> '' - basic layout, 50-50 split
        -> 'topRoundedFrame' - basic layout, 50-50 split with a rounded stroke at the top right corner
        -> 'bottomRoundedFrame' - basic layout, 50-50 split with a rounded stroke at the bottom right corner
        -> 'fullSurfaceColor' - no split, just full color background
            only when fullSurfaceColor is applied: 
                -> '' - there is no image
                -> 'objectGfx' - there is an image
        -> 'fullCanvas' - it uses a background image as the layout of the creative, hides every element, except for the copy_text_2
  image vs video:
        -> '' - by default background_image_1 is shown
        -> 'video' - background_image_1 is hidden, video is shown instead
  sticker:
        -> '' - by default it is shown
        -> 'noSticker' - it will hide the sticker
  color:
        -> '' - default color is blue
        -> 'turqoise'
        -> 'turkiz'
        -> 'teal'
        -> 'pink'
        -> 'peach'
        -> 'orange'
        -> (X) 'darkOrange'
        -> (X) 'blue'
        -> 'stone'
        -> (X) 'darkBlue'
        -> 'purple'
        -> 'aubergine'
        -> 'green'
        -> 'apple'

        -> 'forest'

     <script>
    /* TEXTS START */
 function getActiveSize() {
  var el = document.querySelector('.size_indicator');
  if (!el) return null;

  var bg = window.getComputedStyle(el).backgroundColor;
  var c = bg.replace(/\s/g, '');

  if (c === 'rgb(255,17,0)') return '300x250';
  if (c === 'rgb(0,4,255)') return '300x600';
  if (c === 'rgb(0,255,89)') return '640x360';
  if (c === 'rgb(234,255,0)') return '970x250';

  return null;
}


function applyVariantSpans(container, size) {
  if (!container) return;

  var spans = container.querySelectorAll('span');
  if (!spans || spans.length === 0) return;

  // Check if any span has text-* variant class
  var hasVariantClass = false;
  for (var i = 0; i < spans.length; i++) {
    var cls = spans[i].className || '';
    if (cls.indexOf('text-') !== -1) {
      hasVariantClass = true;
      break;
    }
  }
  if (!hasVariantClass) return;

  // Priority 1: text-allSizes
  var allSizes = container.querySelector('span.text-allSizes');
  if (allSizes) {
    for (var j = 0; j < spans.length; j++) spans[j].style.display = 'none';
    allSizes.style.display = '';
    return;
  }

  // Priority 2: exact size
  var target = null;
  if (size) {
    target = container.querySelector('span.text-' + size);
  }

  // Priority 3: default
  if (!target) {
    target = container.querySelector('span.text-default');
  }

  // Apply visibility
  if (target) {
    for (var k = 0; k < spans.length; k++) spans[k].style.display = 'none';
    target.style.display = '';
  }
}


function runTextVariants() {
  var size = getActiveSize();

  var selector =
    '.headline_text_1, .copy_text_1, .copy_text_2, .cta_text_1, .disclaimer_text_1, .sticker_text_1';

  var nodes = document.querySelectorAll(selector);

  for (var i = 0; i < nodes.length; i++) {
    applyVariantSpans(nodes[i], size);
  }

  // Optional debug
  // console.log('Active size:', size);
}


// Run when DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', runTextVariants);
} else {
  runTextVariants();
}
    /* TEXTS END */
     
      function chooseStickerInnerContent() {
        var textEl = document.querySelector(".sticker_text_1");
        var imgEl = document.querySelector(".sticker_image_1");
        var bgImg3El = document.querySelector(".background_image_3");

        if (!textEl || !imgEl) return;

        var hasText = textEl.textContent.replace(/\s+/g, "").length > 0;
        var imgSrc = imgEl.getAttribute("src") || "";
        var bgImg3ElSrc = bgImg3El.getAttribute("src") || "";
        var hasValidImage =
          imgSrc !== "" && imgSrc.toLowerCase().indexOf("empty") === -1;
        var hasValidImageBG3 =
          bgImg3ElSrc !== "" &&
          bgImg3ElSrc.toLowerCase().indexOf("empty") === -1;

        if (!hasValidImageBG3) {
          bgImg3El.style.display = "none";
        }

        if (hasText) {
          // Text wins over image
          textEl.style.display = "";
          imgEl.style.display = "none";
        } else if (hasValidImage) {
          imgEl.style.display = "";
          textEl.style.display = "none";
        } else {
          textEl.style.display = "none";
          imgEl.style.display = "none";
        }
      }

      // Function to check if an element is empty and hide its parent
      function hideIfEmpty(textSelector, parentSelector) {
        const textElement = document.querySelector(textSelector);
        if (!textElement || textElement.textContent.trim() === "") {
          const parentElement = document.querySelector(parentSelector);
          if (parentElement) {
            parentElement.style.display = "none";
            console.log("Parent element is hidden.");
          }
        }
      }

      setTimeout(function () {
        hideIfEmpty(".disclaimer_text_1", ".disclaimer_text_1");
        chooseStickerInnerContent();
      }, 70);
    </script>
    
<!-- ADFORM SPECIFICS START -->
    <script>
      function onAdInitialized() {
        try {
          console.log(document.interests);
          var thmText = document.querySelector(".thm");

          var startDateLaterThanNow = false,
            endDateEarlierThanNow = false;
          var now = new Date();

          // Testing
          //now.setDate(now.getDate() + 1);

          for (
            var i = 0, interval = "";
            i < Object.keys(document.interests).length;
            i++
          ) {
            interval = Object.keys(document.interests)[i];
            intervalDates = interval.split("_");

            startDateLaterThanNow = now > Date.parse(intervalDates[0]);
            endDateEarlierThanNow = now <= Date.parse(intervalDates[1]);

            if (startDateLaterThanNow && endDateEarlierThanNow) {
              thmText.innerHTML = Object.values(document.interests)[i];
            }
          }

          if (!thmText.innerHTML || !thmText.innerHTML.trim().length) {
            console.error("!!! THM did not changed !!!");
            return;
          }

          console.log("THM will be ", thmText.innerHTML);
        } catch (error) {
          console.error(
            "!!! THM not working, please check all details set correctly !!!",
            error,
          );
        }
      }

      // Get adform detauls
      Adform.DynAdsHelper.getVars(function (variables) {
        replaceContent(variables);
        adVisible();

        // Click url set
        setClickUrl();

        if (typeof variables.directpixel !== "undefined") {
          var dp = document.createElement("img");
          dp.setAttribute("src", variables.directpixel);
          document.body.appendChild(dp);
          console.log("Directpixel inserted", variables.directpixel);
        }
      });

      // On ad visible event
      function adVisible() {
        // Ad visible, start ad/animation.
        if (typeof onAdInitialized === "function") {
          onAdInitialized();
        }
      }

      function setClickUrl() {
        window.clickTAGvalue = dhtml.getVar("clickTAG", document.click_url);
        window.landingpagetarget = dhtml.getVar("landingPageTarget", "_blank");
        console.log(
          "Click url set",
          window.clickTAGvalue,
          window.landingpagetarget,
        );
      }

      function onAdClickTriggered() {
        console.log(
          "Click url triggered",
          window.clickTAGvalue,
          window.landingpagetarget,
        );
        window.open(window.clickTAGvalue, window.landingpagetarget);
      }
    </script>
