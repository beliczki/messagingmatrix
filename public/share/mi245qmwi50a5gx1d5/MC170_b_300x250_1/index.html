  </head>
  <body class="size-300x250">
      <div class="click-url" id="clickLayer">
        <div id="adContainer" class="template_variant_class animated blue withSticker">
          <div id="backgroundContainer">
            <div id="imageWrapper">
              <div style="background-image:url('back2-b.jpg')" class="background_image_1"></div>
            </div>
            <div id="videoWrapper">
              <video autoplay muted playsinline loop onload="playVideo()">
                <source src="" type="video/mp4" class="background_video_1"></video>
            </div>
          </div>
          <main>
            <div id="objectWrapper">
              <div style="background-image:url('empty.png')" class="background_image_2"></div>
            </div>
            <div id="textContainer">
              <div id="stickerContainer">
                <div class="stickerTextWrapper">
                  <p class="sticker_text_1 sticker_style_1" style="font-size: 1.25rem; padding-bottom:0.8rem;"><span class="text-default">Évi akár 90 000 Ft visszatérítés</span><span class="text-allSizes">Évi akár <br/><b>90 000 Ft</b> visszatérítés</span></p>
                  <!-- if p is empty p is not displayed, 
                  content eg.: <b>flash</b> text -->
                </div>
                <div class="stickerImageWrapper">
                  <div style="background-image:url('empty.png')" class="sticker_image_1">
                  empty.png
                  <!-- if div is empty it is not displayed so sticker_image_1 path must be placed into the div as well, 
                  not just into style -->
                  </div>
                </div>
              </div>
              <div id="cardContainer">
                <div class="cardImageWrapper">
                  <div style="background-image:url('empty.mp4')" class="background_image_3">
                  empty.mp4
                  <!-- if div is empty it is not displayed so background_image_3 path must be placed into the div as well, 
                  not just into style -->
                  </div>
                </div>
              </div>
              <!-- if any text layer p is empty 0 height block is displayed -->
              <div id="headlineWrapper">
                <h2 class="headline_text_1 headline_style_1" style="font-size: 1.0rem;">Erste Max Hitelkártya Tudatos szülők választása.</h2>
              </div>
              <div id="copyWrapper1">
                <p class="copy_text_1 copy_style_1" style="font-size: 0.85rem;">Mert az iskolakezdés nem csak kiadás lehet.</p>
              </div>
              <div id="copyWrapper2">
                <!-- copy_text_2 -->
                <p class="thm copy_text_2 copy_style_2" style=""><span class="text-default">THM: 44,66%</span><span class="text-allSizes"><b>THM: 44,66%</b></span></b></p>
              </div>
              <div id="buttonWrapper">
                <span class="cta_text_1 cta_style_1" style="" data="Tervezek">Tervezek</span>
                <!-- if buttonContainer > span is empty no button block is displayed -->
              </div>
              <div id="disclaimerWrapper1">
                <p class="disclaimer_text_1 disclaimer_style_1" style="" data=""></p>
              </div>
            </div>
          </main>
          <div id="frameContainer"></div>
          <div id="logoContainer">
            <div id="logoWrapper">
              <img src="EBH_Logo_screen_white.svg" class="logo logo_image_1 brand_image_1"/>
            </div>
          </div>
        </div>
    </div>
    <!-- extra css to finetune -->
    <style type="text/css">.size-300x600 .headline_text_1 {margin-bottom:0.6rem;}
.size-300x600 .copy_text_2 {margin-top:0.6rem;}

.size-640x360 .headline_text_1 {margin-bottom:0.6rem;}
.size-640x360 .copy_text_2 {margin-top:0.6rem;}
</style>
    <script>
        const ad = document.querySelector('#adContainer');
        document.body.classList.add("size-" + ad.offsetWidth + "x" + ad.offsetHeight);
